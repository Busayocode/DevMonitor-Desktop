
name: Build DevMonitor Windows Installer and Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-devmonitor:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ----------------------------------------------------------
      # 1. CHECK OUT REPOSITORY
      # ----------------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. SET UP NODE.JS
      # ----------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ----------------------------------------------------------
      # 3. SELECT AND EXTRACT NEWEST SOURCE ZIP
      # ----------------------------------------------------------

      - name: Extract newest DevMonitor source ZIP
        id: source
        shell: pwsh
        run: |
          $archives = @(
            git ls-files -- '*.zip' |
              Where-Object {
                Test-Path -LiteralPath $_ -PathType Leaf
              }
          )

          if ($LASTEXITCODE -ne 0) {
            throw "Could not list ZIP files in the repository."
          }

          if ($archives.Count -eq 0) {
            throw "No source ZIP files found in the repository."
          }

          $archiveInfo = @(
            foreach ($path in $archives) {
              $commitTime = git log -1 --format=%ct -- "$path"

              if ($LASTEXITCODE -ne 0 -or -not $commitTime) {
                throw "Could not determine the last update for $path."
              }

              [PSCustomObject]@{
                Path = $path
                CommitTime = [long]$commitTime
              }
            }
          )

          $selected = $archiveInfo |
            Sort-Object -Property `
              @{Expression='CommitTime';Descending=$true}, `
              @{Expression='Path';Descending=$false} |
            Select-Object -First 1

          if (-not $selected) {
            throw "Could not select a source ZIP."
          }

          Write-Host "Selected source ZIP: $($selected.Path)"
          Write-Host "Last updated (UTC): $([DateTimeOffset]::FromUnixTimeSeconds($selected.CommitTime).UtcDateTime)"

          "selected_zip=$($selected.Path)" >> $env:GITHUB_OUTPUT

          $destination = Join-Path $env:GITHUB_WORKSPACE "devmonitor-source"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }

          New-Item -ItemType Directory -Path $destination -Force |
            Out-Null

          $zipPath = Join-Path $env:GITHUB_WORKSPACE $selected.Path

          Expand-Archive `
            -LiteralPath $zipPath `
            -DestinationPath $destination `
            -Force

          Write-Host "Source extracted successfully."

      # ----------------------------------------------------------
      # 4. LOCATE WINDOWS DESKTOP PROJECT
      # ----------------------------------------------------------

      - name: Locate desktop project
        id: desktop
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem `
              -Path "$env:GITHUB_WORKSPACE/devmonitor-source" `
              -Filter "package.json" `
              -Recurse `
              -File
          )

          $package = $null

          foreach ($candidate in $packages) {
            $json = Get-Content `
              -LiteralPath $candidate.FullName `
              -Raw |
              ConvertFrom-Json

            $electron = $false
            $builder = $false
            $dist = $false

            if ($json.dependencies) {
              if ($json.dependencies.electron) {
                $electron = $true
              }
              if ($json.dependencies.'electron-builder') {
                $builder = $true
              }
            }

            if ($json.devDependencies) {
              if ($json.devDependencies.electron) {
                $electron = $true
              }
              if ($json.devDependencies.'electron-builder') {
                $builder = $true
              }
            }

            if ($json.scripts -and $json.scripts.dist) {
              $dist = $true
            }

            if ($electron -and $builder -and $dist) {
              $package = $candidate
              break
            }
          }

          if ($package) {
            Write-Host "Desktop project found:"
            Write-Host $package.FullName

            "available=true" >> $env:GITHUB_OUTPUT
            "path=$($package.DirectoryName)" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host "No compatible Electron desktop project found."
            "available=false" >> $env:GITHUB_OUTPUT
          }

      # ----------------------------------------------------------
      # 5. INSTALL AND BUILD WINDOWS DESKTOP
      # ----------------------------------------------------------

      - name: Install desktop dependencies and build
        if: steps.desktop.outputs.available == 'true'
        shell: pwsh
        run: |
          Set-Location "${{ steps.desktop.outputs.path }}"

          $packageJson = Get-Content `
            -LiteralPath "package.json" `
            -Raw |
            ConvertFrom-Json

          $electronVersion = $null

          if ($packageJson.dependencies) {
            $electronVersion = $packageJson.dependencies.electron
          }

          if (-not $electronVersion -and $packageJson.devDependencies) {
            $electronVersion = $packageJson.devDependencies.electron
          }

          if ($electronVersion) {
            npm pkg set "devDependencies.electron=$electronVersion"

            if ($LASTEXITCODE -ne 0) {
              throw "Could not configure Electron."
            }

            if ($packageJson.dependencies -and $packageJson.dependencies.electron) {
              npm pkg delete "dependencies.electron"

              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove Electron from dependencies."
              }
            }
          }

          npm install --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw "Desktop dependency installation failed."
          }

          npm run dist

          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed."
          }

      # ----------------------------------------------------------
      # 6. LOCATE ANDROID PROJECT
      # ----------------------------------------------------------

      - name: Locate Android project
        id: android
        shell: pwsh
        run: |
          $gradleProjects = @(
            Get-ChildItem `
              -Path "$env:GITHUB_WORKSPACE/devmonitor-source" `
              -Filter "gradlew" `
              -Recurse `
              -File
          )

          $gradleProject = $null

          foreach ($candidate in $gradleProjects) {
            $directory = $candidate.DirectoryName

            $settings = Test-Path `
              -LiteralPath (Join-Path $directory "settings.gradle") `
              -PathType Leaf

            $settingsKts = Test-Path `
              -LiteralPath (Join-Path $directory "settings.gradle.kts") `
              -PathType Leaf

            if ($settings -or $settingsKts) {
              $gradleProject = $candidate
              break
            }
          }

          if ($gradleProject) {
            Write-Host "Android Gradle project found:"
            Write-Host $gradleProject.FullName

            "available=true" >> $env:GITHUB_OUTPUT
            "path=$($gradleProject.DirectoryName)" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host "No Android Gradle project found."
            "available=false" >> $env:GITHUB_OUTPUT
          }

      # ----------------------------------------------------------
      # 7. SET UP JAVA
      # ----------------------------------------------------------

      - name: Set up Java for Android
        if: steps.android.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------------------------
      # 8. SET UP ANDROID SDK
      # ----------------------------------------------------------

      - name: Set up Android SDK
        if: steps.android.outputs.available == 'true'
        uses: android-actions/setup-android@v3

      # ----------------------------------------------------------
      # 9. BUILD ANDROID APK
      # ----------------------------------------------------------

      - name: Build Android APK
        if: steps.android.outputs.available == 'true'
        shell: pwsh
        run: |
          Set-Location "${{ steps.android.outputs.path }}"

          if (-not (Test-Path -LiteralPath ".\gradlew.bat")) {
            throw "Windows Gradle wrapper gradlew.bat not found."
          }

          & .\gradlew.bat assembleDebug --console=plain

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed."
          }

          Write-Host "Android APK build completed."

      # ----------------------------------------------------------
      # 10. UPLOAD WINDOWS INSTALLER
      # ----------------------------------------------------------

      - name: Upload Windows installer
        if: steps.desktop.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer
          path: devmonitor-source/**/release/*.exe
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------
      # 11. UPLOAD ANDROID APK
      # ----------------------------------------------------------

      - name: Upload Android APK
        if: steps.android.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Android-APK
          path: devmonitor-source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------
      # 12. BUILD SUMMARY
      # ----------------------------------------------------------

      - name: Build summary
        if: always()
        shell: pwsh
        env:
          DESKTOP_STATUS: ${{ steps.desktop.outputs.available }}
          ANDROID_STATUS: ${{ steps.android.outputs.available }}
          SOURCE_ZIP: ${{ steps.source.outputs.selected_zip }}
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "DEVMonitor BUILD SUMMARY"
          Write-Host "=========================================="
          Write-Host "Source ZIP: $env:SOURCE_ZIP"

          if ($env:DESKTOP_STATUS -eq "true") {
            Write-Host "Windows: Build configured"
          }
          else {
            Write-Host "Windows: No desktop project detected"
          }

          if ($env:ANDROID_STATUS -eq "true") {
            Write-Host "Android: Build configured"
          }
          else {
            Write-Host "Android: No Android project detected"
          }

          Write-Host "=========================================="
