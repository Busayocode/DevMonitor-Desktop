name: Build DevMonitor Native Windows

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
      - '.github/workflows/build-windows.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find DevMonitor source ZIP
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Finding DevMonitor Windows ZIP..."

          $sha = "${{ github.sha }}"

          $changed = @(
            git diff-tree `
              --no-commit-id `
              --name-only `
              --diff-filter=AM `
              -r `
              $sha `
              -- '*.zip'
          )

          $changedWindowsZips = @(
            $changed |
            Where-Object {
              $_ -match '(?i)DevMonitor.*Windows.*\.zip$'
            }
          )

          if ($changedWindowsZips.Count -gt 0) {

            $relativePath = $changedWindowsZips[-1]
            $zipPath = $relativePath -replace '/', '\'

            if (-not (Test-Path -LiteralPath $zipPath)) {
              throw "Selected ZIP does not exist: $zipPath"
            }

            $zipFullPath = (Resolve-Path -LiteralPath $zipPath).Path

            Write-Host "Using ZIP changed by this commit:"
            Write-Host $zipFullPath

          }
          else {

            Write-Host "No ZIP changed by this commit."
            Write-Host "Finding latest existing DevMonitor Windows ZIP..."

            $existingZips = @(
              Get-ChildItem `
                -Path . `
                -Filter "*.zip" `
                -File `
                -Recurse |
              Where-Object {
                $_.Name -match '(?i)^DevMonitor.*Windows.*\.zip$'
              }
            )

            if ($existingZips.Count -eq 0) {
              throw "No DevMonitor Windows ZIP was found."
            }

            $latest = $null
            $latestDate = 0

            foreach ($file in $existingZips) {

              $relative = $file.FullName.Substring(
                (Get-Location).Path.Length
              ).TrimStart('\')

              $commitDate = git log `
                -1 `
                --format="%ct" `
                -- "$relative"

              if ($commitDate) {
                $commitDate = [int64]$commitDate

                if ($commitDate -gt $latestDate) {
                  $latestDate = $commitDate
                  $latest = $file.FullName
                }
              }
            }

            if (-not $latest) {
              throw "Unable to determine latest DevMonitor Windows ZIP."
            }

            $zipFullPath = $latest

            Write-Host "Using latest existing ZIP:"
            Write-Host $zipFullPath
          }

          $zipName = Split-Path $zipFullPath -Leaf

          "zip_path=$zipFullPath" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

          Write-Host ""
          Write-Host "Source ZIP:"
          Write-Host $zipName


      - name: Extract source ZIP
        id: extract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "${{ steps.source.outputs.zip_path }}"
          $extractDir = Join-Path $env:RUNNER_TEMP "DevMonitorSource"

          if (Test-Path $extractDir) {
            Remove-Item $extractDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractDir | Out-Null

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $extractDir `
            -Force

          "extract_dir=$extractDir" >> $env:GITHUB_OUTPUT

          Write-Host "Source extracted."


      - name: Locate Windows project
        id: project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "${{ steps.extract.outputs.extract_dir }}"

          $projects = @(
            Get-ChildItem `
              -Path $root `
              -Filter "DevMonitor.Windows.csproj" `
              -File `
              -Recurse
          )

          if ($projects.Count -eq 0) {
            throw "DevMonitor.Windows.csproj was not found."
          }

          $project = $projects[0]

          "project_path=$($project.FullName)" >> $env:GITHUB_OUTPUT
          "project_dir=$($project.Directory.FullName)" >> $env:GITHUB_OUTPUT

          Write-Host "Project:"
          Write-Host $project.FullName


      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      - name: Determine version
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipName = "${{ steps.source.outputs.zip_name }}"

          $match = [regex]::Match(
            $zipName,
            '(?i)(\d+\.\d+\.\d+(?:\.\d+)?)'
          )

          if ($match.Success) {
            $version = $match.Groups[1].Value
          }
          else {

            $match = [regex]::Match(
              $zipName,
              '(?i)v(\d+)'
            )

            if ($match.Success) {
              $version = "0.0.$($match.Groups[1].Value)"
            }
            else {
              $version = "0.0.${{ github.run_number }}"
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Version: $version"


      - name: Restore project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore `
            "${{ steps.project.outputs.project_path }}"


      - name: Publish Windows application
        id: publish
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ steps.project.outputs.project_path }}"
          $publish = Join-Path $env:RUNNER_TEMP "DevMonitorPublish"

          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publish | Out-Null

          dotnet publish `
            "$project" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$publish" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

          "publish_dir=$publish" >> $env:GITHUB_OUTPUT

          Write-Host "Windows publish completed."


      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install innosetup --no-progress --yes

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          Write-Host "Inno Setup installed."


      - name: Create installer script
        id: installer_script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ steps.project.outputs.project_dir }}"
          $publishDir = "${{ steps.publish.outputs.publish_dir }}"
          $installerDir = Join-Path $env:RUNNER_TEMP "DevMonitorInstaller"

          if (Test-Path $installerDir) {
            Remove-Item $installerDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $installerDir | Out-Null

          $icon = Join-Path $projectDir "Assets\DevMonitor.ico"

          if (-not (Test-Path $icon)) {
            throw "DevMonitor.ico was not found."
          }

          $version = "${{ steps.version.outputs.version }}"
          $runNumber = "${{ github.run_number }}"

          $setupName = "DevMonitor-Setup-v$version-Run-$runNumber"

          $iss = Join-Path `
            $env:RUNNER_TEMP `
            "DevMonitor.iss"

          $script = @"
#define MyAppName "DevMonitor"
#define MyAppVersion "$version"
#define MyAppPublisher "DevMonitor"
#define MyAppExeName "DevMonitor.exe"

[Setup]
AppId={{7D1D1F54-8E9E-4D25-B4A7-DEV-MONITOR}}
AppName={#MyAppName}
AppVersion={#MyAppVersion}
AppPublisher={#MyAppPublisher}
DefaultDirName={autopf}\DevMonitor
DefaultGroupName=DevMonitor
OutputDir=$installerDir
OutputBaseFilename=$setupName
ArchitecturesInstallIn64BitMode=x64compatible
ArchitecturesAllowed=x64compatible
Compression=lzma2
SolidCompression=yes
WizardStyle=modern
SetupIconFile=$icon
UninstallDisplayIcon={app}\DevMonitor.exe
PrivilegesRequired=admin

[Files]
Source: "$publishDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

[Icons]
Name: "{group}\DevMonitor"; Filename: "{app}\DevMonitor.exe"
Name: "{autodesktop}\DevMonitor"; Filename: "{app}\DevMonitor.exe"; Tasks: desktopicon

[Tasks]
Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked

[Dirs]
Name: "{localappdata}\DevMonitor"

[Run]
Filename: "{app}\DevMonitor.exe"; Description: "Launch DevMonitor"; Flags: nowait postinstall skipifsilent
"@

          Set-Content `
            -Path $iss `
            -Value $script `
            -Encoding UTF8

          "iss_path=$iss" >> $env:GITHUB_OUTPUT
          "installer_dir=$installerDir" >> $env:GITHUB_OUTPUT

          Write-Host "Installer script created."


      - name: Build Windows installer
        id: installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $iss = "${{ steps.installer_script.outputs.iss_path }}"
          $installerDir = "${{ steps.installer_script.outputs.installer_dir }}"

          & $iscc $iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $version = "${{ steps.version.outputs.version }}"
          $runNumber = "${{ github.run_number }}"

          $installerPath = Join-Path `
            $installerDir `
            "DevMonitor-Setup-v$version-Run-$runNumber.exe"

          if (-not (Test-Path $installerPath)) {
            throw "Installer was not created."
          }

          "installer_path=$installerPath" >> $env:GITHUB_OUTPUT

          Write-Host ""
          Write-Host "INSTALLER CREATED:"
          Write-Host $installerPath


      - name: Create Windows package ZIP
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = "${{ steps.publish.outputs.publish_dir }}"

          $packageZip = Join-Path `
            $env:RUNNER_TEMP `
            "DevMonitor-Windows-v${{ steps.version.outputs.version }}-Run-${{ github.run_number }}.zip"

          if (Test-Path $packageZip) {
            Remove-Item $packageZip -Force
          }

          Compress-Archive `
            -Path "$publishDir\*" `
            -DestinationPath $packageZip `
            -CompressionLevel Optimal

          "package_zip=$packageZip" >> $env:GITHUB_OUTPUT

          Write-Host "Package ZIP created."


      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer-v${{ steps.version.outputs.version }}-Run-${{ github.run_number }}
          path: ${{ steps.installer.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 90


      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Package-v${{ steps.version.outputs.version }}-Run-${{ github.run_number }}
          path: ${{ steps.package.outputs.package_zip }}
          if-no-files-found: error
          retention-days: 90


      - name: Build summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DevMonitor Windows Build Completed"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Source ZIP:"
          Write-Host "${{ steps.source.outputs.zip_name }}"
          Write-Host ""
          Write-Host "Version:"
          Write-Host "${{ steps.version.outputs.version }}"
          Write-Host ""
          Write-Host "Run:"
          Write-Host "${{ github.run_number }}"
          Write-Host ""
          Write-Host "Previous ZIPs were not modified."
          Write-Host "Previous build artifacts were not replaced."
          Write-Host ""
