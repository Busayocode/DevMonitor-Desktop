name: Build DevMonitor Native Windows

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
      - '.github/workflows/build-windows.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout the complete repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # 2. Find the source ZIP
      #
      # Priority:
      #   A. ZIP changed in the current commit
      #   B. Otherwise use the newest DevMonitor Windows ZIP
      #
      # This allows the workflow file itself to be committed without
      # causing the build to fail.
      # ------------------------------------------------------------
      - name: Find DevMonitor source ZIP
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Finding DevMonitor source ZIP"
          Write-Host "============================================"
          Write-Host ""

          $sha = "${{ github.sha }}"

          # --------------------------------------------------------
          # First: look for a DevMonitor Windows ZIP changed in
          # the commit that triggered this workflow.
          # --------------------------------------------------------
          $changed = @(
            git diff-tree `
              --no-commit-id `
              --name-only `
              --diff-filter=AM `
              -r `
              $sha `
              -- '*.zip'
          )

          Write-Host "ZIP files changed in this commit:"
          
          if ($changed.Count -eq 0) {
            Write-Host "  None"
          }
          else {
            $changed | ForEach-Object {
              Write-Host "  $_"
            }
          }

          $changedWindowsZips = @(
            $changed |
            Where-Object {
              $_ -match '(?i)DevMonitor.*Windows.*\.zip$'
            }
          )

          # --------------------------------------------------------
          # If this commit contains a new/changed DevMonitor ZIP,
          # use it.
          # --------------------------------------------------------
          if ($changedWindowsZips.Count -gt 0) {

            if ($changedWindowsZips.Count -gt 1) {
              Write-Host ""
              Write-Host "Multiple DevMonitor Windows ZIPs changed."
              Write-Host "Using the last one returned by Git:"
              $changedWindowsZips | ForEach-Object {
                Write-Host "  $_"
              }
            }

            $relativePath = $changedWindowsZips[-1]

            $zipPath = $relativePath -replace '/', '\'

            if (-not (Test-Path -LiteralPath $zipPath)) {
              throw "Selected ZIP does not exist: $zipPath"
            }

            $zipFullPath = (Resolve-Path -LiteralPath $zipPath).Path

            Write-Host ""
            Write-Host "A DevMonitor ZIP was changed by this commit."
            Write-Host "Using:"
            Write-Host "  $zipFullPath"
          }

          # --------------------------------------------------------
          # Otherwise this was probably a workflow/manual run.
          # Find all existing DevMonitor Windows ZIPs.
          # --------------------------------------------------------
          else {

            Write-Host ""
            Write-Host "No DevMonitor Windows ZIP was changed by this commit."
            Write-Host "Searching the repository for an existing source ZIP..."
            Write-Host ""

            $existingZips = @(
              Get-ChildItem `
                -Path . `
                -Filter "*.zip" `
                -File `
                -Recurse |
              Where-Object {
                $_.Name -match '(?i)^DevMonitor.*Windows.*\.zip$'
              }
            )

            if ($existingZips.Count -eq 0) {
              throw "No DevMonitor Windows ZIP exists in the repository."
            }

            Write-Host "Existing DevMonitor Windows ZIPs:"
            $existingZips | ForEach-Object {
              Write-Host "  $($_.FullName)"
            }

            # Use Git's commit history to determine which ZIP is
            # newest in the repository rather than relying on the
            # Windows filesystem timestamp.
            $latestCommitInfo = @()

            foreach ($file in $existingZips) {

              $relative = $file.FullName.Substring(
                (Get-Location).Path.Length
              ).TrimStart('\')

              $commitDate = git log `
                -1 `
                --format="%ct" `
                -- "$relative"

              if ($commitDate) {
                $latestCommitInfo += [PSCustomObject]@{
                  Path = $file.FullName
                  Date = [int64]$commitDate
                }
              }
            }

            if ($latestCommitInfo.Count -eq 0) {
              throw "Unable to determine the latest DevMonitor Windows ZIP."
            }

            $selected = $latestCommitInfo |
              Sort-Object Date -Descending |
              Select-Object -First 1

            $zipFullPath = $selected.Path

            Write-Host ""
            Write-Host "Using latest existing DevMonitor Windows ZIP:"
            Write-Host "  $zipFullPath"
          }

          $zipName = Split-Path $zipFullPath -Leaf

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Selected source"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "ZIP:"
          Write-Host "  $zipName"
          Write-Host ""
          Write-Host "Path:"
          Write-Host "  $zipFullPath"
          Write-Host ""

          "zip_path=$zipFullPath" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT


      # ------------------------------------------------------------
      # 3. Extract source ZIP
      # ------------------------------------------------------------
      - name: Extract source ZIP
        id: extract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "${{ steps.source.outputs.zip_path }}"
          $extractDir = Join-Path $env:RUNNER_TEMP "DevMonitorSource"

          if (Test-Path $extractDir) {
            Remove-Item $extractDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $extractDir | Out-Null

          Write-Host "Extracting:"
          Write-Host "  $zip"
          Write-Host ""

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $extractDir `
            -Force

          Write-Host "Extraction complete."

          "extract_dir=$extractDir" >> $env:GITHUB_OUTPUT


      # ------------------------------------------------------------
      # 4. Locate native WPF project
      # ------------------------------------------------------------
      - name: Locate Windows project
        id: project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "${{ steps.extract.outputs.extract_dir }}"

          $projects = @(
            Get-ChildItem `
              -Path $root `
              -Filter "DevMonitor.Windows.csproj" `
              -File `
              -Recurse
          )

          if ($projects.Count -eq 0) {
            throw "DevMonitor.Windows.csproj was not found in the uploaded ZIP."
          }

          $projectPath = $projects[0].FullName
          $projectDir = $projects[0].Directory.FullName

          Write-Host ""
          Write-Host "Windows project:"
          Write-Host "  $projectPath"
          Write-Host ""

          "project_path=$projectPath" >> $env:GITHUB_OUTPUT
          "project_dir=$projectDir" >> $env:GITHUB_OUTPUT


      # ------------------------------------------------------------
      # 5. Setup .NET 8
      # ------------------------------------------------------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # ------------------------------------------------------------
      # 6. Determine application version
      # ------------------------------------------------------------
      - name: Determine build version
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipName = "${{ steps.source.outputs.zip_name }}"

          Write-Host "Source ZIP:"
          Write-Host "  $zipName"
          Write-Host ""

          # Look for a normal semantic version first.
          #
          # Examples:
          #   4.6.0.181
          #   4.3.5.59
          #   4.4.0
          #
          $match = [regex]::Match(
            $zipName,
            '(?i)(\d+\.\d+\.\d+(?:\.\d+)?)'
          )

          if ($match.Success) {

            $version = $match.Groups[1].Value

          }
          else {

            # Fall back to a simple v181 style number.
            $match = [regex]::Match(
              $zipName,
              '(?i)v(\d+)'
            )

            if ($match.Success) {

              $version = "0.0.$($match.Groups[1].Value)"

            }
            else {

              $version = "0.0.${{ github.run_number }}"

            }
          }

          Write-Host "Detected version:"
          Write-Host "  $version"
          Write-Host ""

          "version=$version" >> $env:GITHUB_OUTPUT


      # ------------------------------------------------------------
      # 7. Restore
      # ------------------------------------------------------------
      - name: Restore project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore `
            "${{ steps.project.outputs.project_path }}"


      # ------------------------------------------------------------
      # 8. Publish self-contained Windows application
      # ------------------------------------------------------------
      - name: Publish Windows application
        id: publish
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ steps.project.outputs.project_path }}"
          $publish = Join-Path $env:RUNNER_TEMP "DevMonitorPublish"

          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publish | Out-Null

          dotnet publish `
            "$project" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$publish" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

          Write-Host ""
          Write-Host "Publish completed."
          Write-Host ""

          Get-ChildItem `
            $publish `
            -Recurse |
          ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          "publish_dir=$publish" >> $env:GITHUB_OUTPUT


      # ------------------------------------------------------------
      # 9. Install Inno Setup
      # ------------------------------------------------------------
      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install innosetup --no-progress --yes

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          Write-Host "Inno Setup ready."


      # ------------------------------------------------------------
      # 10. Build normal Windows installer
      # ------------------------------------------------------------
      - name: Build Windows installer
        id: installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ steps.project.outputs.project_dir }}"
          $publishDir = "${{ steps.publish.outputs.publish_dir }}"

          $installerDir = Join-Path `
            $env:RUNNER_TEMP `
            "DevMonitorInstaller"

          if (Test-Path $installerDir) {
            Remove-Item $installerDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $installerDir | Out-Null

          # --------------------------------------------------------
          # Use the supplied DevMonitor icon.
          # --------------------------------------------------------
          $icon = Join-Path `
            $projectDir `
            "Assets\DevMonitor.ico"

          if (-not (Test-Path $icon)) {
            throw "DevMonitor.ico was not found: $icon"
          }

          $version = "${{ steps.version.outputs.version }}"
          $run = "${{ github.run_number }}"

          $setupBaseName = "DevMonitor-Setup-v$version-Run-$run"

          $iss = Join-Path `
            $env:RUNNER_TEMP `
            "DevMonitor.iss"

          $escapedPublish = $publishDir.Replace('\', '\\')
          $escapedIcon = $icon.Replace('\', '\\')
          $escapedOutput = $installerDir.Replace('\', '\\')

          $script = @"
#define MyAppName "DevMonitor"
#define MyAppVersion "$version"
#define MyAppPublisher "DevMonitor"
#define MyAppExeName "DevMonitor.exe"

[Setup]
AppId={{7D1D1F54-8E9E-4D25-B4A7-DEV-MONITOR}}
AppName={#MyAppName}
AppVersion={#MyAppVersion}
AppPublisher={#MyAppPublisher}

DefaultDirName={autopf}\DevMonitor
DefaultGroupName=DevMonitor

OutputDir=$escapedOutput
OutputBaseFilename=$setupBaseName

ArchitecturesInstallIn64BitMode=x64compatible
ArchitecturesAllowed=x64compatible

Compression=lzma2
SolidCompression=yes

WizardStyle=modern

SetupIconFile=$escapedIcon
UninstallDisplayIcon={app}\DevMonitor.exe

PrivilegesRequired=admin

[Files]
Source: "$escapedPublish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

[Icons]
Name: "{group}\DevMonitor"; Filename: "{app}\DevMonitor.exe"
Name: "{autodesktop}\DevMonitor"; Filename: "{app}\DevMonitor.exe"; Tasks: desktopicon

[Tasks]
Name: "desktopicon"
Description: "Create a desktop shortcut"
GroupDescription: "Additional icons:"
Flags: unchecked

[Dirs]
Name: "{localappdata}\DevMonitor"

[Run]
Filename: "{app}\DevMonitor.exe"
Description: "Launch DevMonitor"
Flags: nowait postinstall skipifsilent

[UninstallDelete]
Type: filesandordirs
Name: "{localappdata}\DevMonitor"
"@

          Set-Content `
            -Path $iss `
            -Value $script `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Compiling installer..."
          Write-Host ""

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          & $iscc $iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installerPath = Join-Path `
            $installerDir `
            "$setupBaseName.exe"

          if (-not (Test-Path $installerPath)) {
            throw "Installer was not created: $installerPath"
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "INSTALLER CREATED"
          Write-Host "============================================"
          Write-Host ""
          Write-Host $installerPath
          Write-Host ""

          "installer_path=$installerPath" >> $env:GITHUB_OUTPUT


      # ------------------------------------------------------------
      # 11. Create portable package as an additional artifact
      # ------------------------------------------------------------
      - name: Create Windows package ZIP
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = "${{ steps.publish.outputs.publish_dir }}"

          $packageZip = Join-Path `
            $env:RUNNER_TEMP `
            "DevMonitor-Windows-v${{ steps.version.outputs.version }}-Run-${{ github.run_number }}.zip"

          if (Test-Path $packageZip) {
            Remove-Item $packageZip -Force
          }

          Compress-Archive `
            -Path "$publishDir\*" `
            -DestinationPath $packageZip `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "Package created:"
          Write-Host "  $packageZip"

          "package_zip=$packageZip" >> $env:GITHUB_OUTPUT


      # ------------------------------------------------------------
      # 12. Upload installer
      #
      # Every workflow run receives a unique artifact name.
      # Older artifacts are NOT replaced.
      # ------------------------------------------------------------
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer-v${{ steps.version.outputs.version }}-Run-${{ github.run_number }}
          path: ${{ steps.installer.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 90


      # ------------------------------------------------------------
      # 13. Upload application package
      # ------------------------------------------------------------
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Package-v${{ steps.version.outputs.version }}-Run-${{ github.run_number }}
          path: ${{ steps.package.outputs.package_zip }}
          if-no-files-found: error
          retention-days: 90


      # ------------------------------------------------------------
      # 14. Final build summary
      # ------------------------------------------------------------
      - name: Build summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================================"
          Write-Host " DevMonitor Windows Build Completed"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "Source:"
          Write-Host "  ${{ steps.source.outputs.zip_name }}"
          Write-Host ""
          Write-Host "Version:"
          Write-Host "  ${{ steps.version.outputs.version }}"
          Write-Host ""
          Write-Host "GitHub Run:"
          Write-Host "  ${{ github.run_number }}"
          Write-Host ""
          Write-Host "Installer:"
          Write-Host "  DevMonitor-Setup-v${{ steps.version.outputs.version }}-Run-${{ github.run_number }}.exe"
          Write-Host ""
          Write-Host "Previous source ZIPs remain untouched."
          Write-Host "Previous build artifacts remain separate."
          Write-Host ""
          Write-Host "======================================================"
