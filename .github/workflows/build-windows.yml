name: Build DevMonitor Native Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find newest DevMonitor Windows ZIP
        id: source
        shell: pwsh
        run: |
          $archives = @(
            git ls-files -- '*.zip' |
              Where-Object {
                $_ -match 'DevMonitor.*Windows.*\.zip$' -and
                (Test-Path -LiteralPath $_ -PathType Leaf)
              }
          )

          if ($LASTEXITCODE -ne 0) {
            throw "Could not list ZIP files in the repository."
          }

          if ($archives.Count -eq 0) {
            throw "No DevMonitor Windows ZIP files were found."
          }

          Write-Host "Windows ZIP files found:"
          $archives | ForEach-Object {
            Write-Host " - $_"
          }

          $archiveInfo = @(
            foreach ($path in $archives) {
              $commitTime = git log -1 --format=%ct -- "$path"

              if ($LASTEXITCODE -ne 0 -or -not $commitTime) {
                throw "Could not determine the last update time for $path."
              }

              [PSCustomObject]@{
                Path = $path
                CommitTime = [long]$commitTime
              }
            }
          )

          $selected = $archiveInfo |
            Sort-Object `
              -Property `
                @{Expression='CommitTime';Descending=$true}, `
                @{Expression='Path';Descending=$false} |
            Select-Object -First 1

          if (-not $selected) {
            throw "Could not select the newest Windows source ZIP."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Selected Windows source:"
          Write-Host $selected.Path
          Write-Host "=========================================="

          "selected_zip=$($selected.Path)" >> $env:GITHUB_OUTPUT

      - name: Extract Windows source
        shell: pwsh
        run: |
          $sourceZip = "${{ steps.source.outputs.selected_zip }}"
          $destination = Join-Path $env:GITHUB_WORKSPACE "devmonitor-source"

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $destination `
            -Force |
            Out-Null

          Write-Host "Extracting:"
          Write-Host $sourceZip

          Expand-Archive `
            -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $sourceZip) `
            -DestinationPath $destination `
            -Force

          Write-Host "Source extracted."

      - name: Locate native Windows project
        id: project
        shell: pwsh
        run: |
          $projects = @(
            Get-ChildItem `
              -Path "$env:GITHUB_WORKSPACE/devmonitor-source" `
              -Filter "*.csproj" `
              -Recurse `
              -File
          )

          if ($projects.Count -eq 0) {
            throw "No .csproj file was found in the Windows source ZIP."
          }

          Write-Host "C# projects found:"
          $projects | ForEach-Object {
            Write-Host " - $($_.FullName)"
          }

          $project = $projects |
            Where-Object {
              $_.Name -eq "DevMonitor.Windows.csproj"
            } |
            Select-Object -First 1

          if (-not $project) {
            $project = $projects | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected project:"
          Write-Host $project.FullName

          "path=$($project.FullName)" >> $env:GITHUB_OUTPUT
          "directory=$($project.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Restore .NET project
        shell: pwsh
        run: |
          $project = "${{ steps.project.outputs.path }}"

          Write-Host "Restoring:"
          Write-Host $project

          dotnet restore "$project"

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed."
          }

      - name: Build and publish Windows EXE
        shell: pwsh
        run: |
          $project = "${{ steps.project.outputs.path }}"
          $output = Join-Path $env:GITHUB_WORKSPACE "windows-publish"

          if (Test-Path -LiteralPath $output) {
            Remove-Item -LiteralPath $output -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $output `
            -Force |
            Out-Null

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Publishing DevMonitor for Windows x64"
          Write-Host "=========================================="

          dotnet publish "$project" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o "$output"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows publish failed."
          }

          Write-Host ""
          Write-Host "Published files:"
          Get-ChildItem `
            -Path $output `
            -Recurse `
            -File |
            ForEach-Object {
              Write-Host " - $($_.FullName)"
            }

      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE "windows-publish"

          $exe = Get-ChildItem `
            -Path $publish `
            -Filter "*.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "No Windows EXE was produced."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "EXE BUILD SUCCESSFUL"
          Write-Host "=========================================="
          Write-Host "EXE:"
          Write-Host $exe.FullName
          Write-Host "Size:"
          Write-Host "$([math]::Round($exe.Length / 1MB, 2)) MB"

      - name: Create ZIP package
        shell: pwsh
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE "windows-publish"
          $package = Join-Path $env:GITHUB_WORKSPACE "DevMonitor-Windows-x64.zip"

          if (Test-Path -LiteralPath $package) {
            Remove-Item -LiteralPath $package -Force
          }

          Compress-Archive `
            -Path "$publish\*" `
            -DestinationPath $package `
            -Force

          Write-Host "Created:"
          Write-Host $package

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-x64
          path: windows-publish/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-x64-Full
          path: DevMonitor-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: pwsh
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.selected_zip }}
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "DEVMonitor Native Windows BUILD SUMMARY"
          Write-Host "=========================================="
          Write-Host "Source ZIP:"
          Write-Host $env:SOURCE_ZIP
          Write-Host ""
          Write-Host "Target: Windows x64"
          Write-Host "Runtime: .NET 8"
          Write-Host "Application: Native WPF"
          Write-Host "Self-contained: Yes"
          Write-Host "Single-file EXE: Yes"
          Write-Host ""
          Write-Host "Artifacts:"
          Write-Host " - DevMonitor-Windows-x64"
          Write-Host " - DevMonitor-Windows-x64-Full"
          Write-Host "=========================================="
