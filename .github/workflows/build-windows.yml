name: Build DevMonitor Native Windows

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
      - '.github/workflows/build-windows.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find available DevMonitor source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host "Finding DevMonitor source ZIP"
          Write-Host "============================================"

          $allZips = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "*.zip" `
            -Recurse `
            -File

          $devMonitorZips = @(
            $allZips |
            Where-Object {
              $_.Name -match "DevMonitor" -and
              $_.Name -notmatch "Windows-Installer" -and
              $_.Name -notmatch "Windows-Package"
            }
          )

          if ($devMonitorZips.Count -eq 0) {
            throw "No DevMonitor source ZIP exists in the current repository checkout."
          }

          Write-Host ""
          Write-Host "DevMonitor ZIP files currently available:"
          Write-Host ""

          foreach ($item in $devMonitorZips) {
            Write-Host " - $($item.FullName)"
          }

          Write-Host ""

          $changedFiles = git diff-tree `
            --no-commit-id `
            --name-only `
            -r `
            $env:GITHUB_SHA

          $changedZipName = $changedFiles |
            Where-Object {
              $_ -match "\.zip$" -and
              $_ -match "DevMonitor"
            } |
            Select-Object -First 1

          $selectedZip = $null

          if ($changedZipName) {
            $candidatePath = Join-Path `
              $env:GITHUB_WORKSPACE `
              $changedZipName

            if (Test-Path $candidatePath) {
              $selectedZip = Get-Item $candidatePath
              Write-Host "Using DevMonitor ZIP changed by this commit:"
              Write-Host $selectedZip.FullName
            }
          }

          if (-not $selectedZip) {
            Write-Host "No usable DevMonitor ZIP was changed by this commit."
            Write-Host "Selecting the newest DevMonitor ZIP that actually exists."

            $selectedZip = $devMonitorZips |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if (-not $selectedZip) {
            throw "Unable to select an existing DevMonitor source ZIP."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Selected source ZIP:"
          Write-Host $selectedZip.FullName
          Write-Host "============================================"
          Write-Host ""

          "SOURCE_ZIP=$($selectedZip.FullName)" >> $env:GITHUB_ENV
          "SOURCE_ZIP_NAME=$($selectedZip.Name)" >> $env:GITHUB_ENV

      - name: Extract source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:SOURCE_ZIP)) {
            throw "Source ZIP was not found: $env:SOURCE_ZIP"
          }

          Write-Host "Extracting:"
          Write-Host $env:SOURCE_ZIP

          $extractDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "source"

          if (Test-Path $extractDir) {
            Remove-Item `
              $extractDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $extractDir |
            Out-Null

          Expand-Archive `
            -Path $env:SOURCE_ZIP `
            -DestinationPath $extractDir `
            -Force

          Write-Host "Extraction completed."

      - name: Locate Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "source") `
            -Filter "DevMonitor.Windows.csproj" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $project) {
            Write-Host ""
            Write-Host "Files found inside source:"
            Get-ChildItem `
              -Path (Join-Path $env:GITHUB_WORKSPACE "source") `
              -Recurse `
              -File |
              Select-Object -First 100 FullName |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw "DevMonitor.Windows.csproj was not found inside the source ZIP."
          }

          Write-Host "Windows project found:"
          Write-Host $project.FullName

          "PROJECT_FILE=$($project.FullName)" >> $env:GITHUB_ENV
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine build version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zipName = $env:SOURCE_ZIP_NAME

          Write-Host "Source ZIP:"
          Write-Host $zipName

          if ($zipName -match "(\d+\.\d+\.\d+\.\d+)") {
            $version = $Matches[1]
          }
          elseif ($zipName -match "v(\d+)") {
            $version = "0.0.$($Matches[1]).0"
          }
          else {
            $version = "1.0.0.0"
          }

          Write-Host "Build version: $version"

          "BUILD_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore .NET project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore "$env:PROJECT_FILE"

      - name: Publish Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          if (Test-Path $publishDir) {
            Remove-Item `
              $publishDir `
              -Recurse `
              -Force
          }

          dotnet publish "$env:PROJECT_FILE" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$publishDir" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version="$env:BUILD_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

      - name: Verify published application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem `
            -Path (Join-Path $env:GITHUB_WORKSPACE "publish") `
            -Filter "*.exe" `
            -File |
            Where-Object {
              $_.Name -notmatch "setup" -and
              $_.Name -notmatch "unins"
            } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Published DevMonitor EXE was not found."
          }

          Write-Host "Published application:"
          Write-Host $exe.FullName

          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install innosetup --no-progress --yes

      - name: Create installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "DevMonitorInstaller.iss"

          $sourceDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          $outputDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "installer"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $outputDir |
            Out-Null

          $iss = @"
[Setup]
AppId={{9F55A2C7-4F8B-4B9B-9A75-DEV-MONITOR}}
AppName=DevMonitor
AppVersion=$env:BUILD_VERSION
AppPublisher=DevMonitor
DefaultDirName={autopf}\DevMonitor
DefaultGroupName=DevMonitor
UninstallDisplayName=DevMonitor
OutputDir=$outputDir
OutputBaseFilename=DevMonitor-Setup-$env:BUILD_VERSION
Compression=lzma
SolidCompression=yes
ArchitecturesInstallIn64BitMode=x64compatible
PrivilegesRequired=admin
DisableProgramGroupPage=yes
WizardStyle=modern

[Files]
Source: "$sourceDir\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

[Icons]
Name: "{group}\DevMonitor"; Filename: "{app}\DevMonitor.exe"
Name: "{autodesktop}\DevMonitor"; Filename: "{app}\DevMonitor.exe"; Tasks: desktopicon

[Tasks]
Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

[Run]
Filename: "{app}\DevMonitor.exe"; Description: "Launch DevMonitor"; Flags: nowait postinstall skipifsilent
"@

          Set-Content `
            -Path $scriptPath `
            -Value $iss `
            -Encoding UTF8

          Write-Host "Installer script created:"
          Write-Host $scriptPath

          "INSTALLER_SCRIPT=$scriptPath" >> $env:GITHUB_ENV

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          & $iscc "$env:INSTALLER_SCRIPT"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create standalone package ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageName = "DevMonitor-Windows-$env:BUILD_VERSION.zip"

          $packagePath = Join-Path `
            $env:GITHUB_WORKSPACE `
            $packageName

          if (Test-Path $packagePath) {
            Remove-Item `
              $packagePath `
              -Force
          }

          Compress-Archive `
            -Path (Join-Path $env:GITHUB_WORKSPACE "publish\*") `
            -DestinationPath $packagePath `
            -Force

          Write-Host "Standalone package created:"
          Write-Host $packagePath

          "PACKAGE_PATH=$packagePath" >> $env:GITHUB_ENV

      - name: Find installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installerDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "installer"

          $installer = Get-ChildItem `
            -Path $installerDir `
            -Filter "*.exe" `
            -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "Windows installer was not created."
          }

          Write-Host "Installer created:"
          Write-Host $installer.FullName

          "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Installer-${{ env.BUILD_VERSION }}-${{ github.run_number }}
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-Windows-Package-${{ env.BUILD_VERSION }}-${{ github.run_number }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "DevMonitor Windows build completed"
          Write-Host "============================================"
          Write-Host "Version: $env:BUILD_VERSION"
          Write-Host "Source ZIP: $env:SOURCE_ZIP_NAME"
          Write-Host ""
          Write-Host "Artifacts created:"
          Write-Host " - Windows Installer"
          Write-Host " - Standalone Package"
          Write-Host ""
          Write-Host "Previous builds are not overwritten."
          Write-Host "============================================"
